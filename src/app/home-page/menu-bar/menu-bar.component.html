<nav class="navbar bg-primary" data-bs-theme="dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1" style="font-size: 2rem;">Supermarket</span>
    <ul class="nav justify-content-end">
       <li class="nav-item">
         <a class="nav-link active fs-3 text-light" aria-current="page" [routerLink]="accountState">MyAccount</a>
       </li>
       <li class="nav-item">
         <a class="nav-link" href="#" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
            </svg>
         </a>
        <div class="offcanvas offcanvas-end bg-white" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
          <div class="offcanvas-header text-bg-primary">
             <h5 class="offcanvas-title" id="offcanvasRightLabel">Cart</h5>
             <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
        <div class="offcanvas-body">
            <ng-template #items></ng-template>
            <h3 style="color: black;">Total=R${{total_compra}}</h3>
            <a class="btn btn-success d-block mx-auto btn-lg {{buttonVisual}}" role="button" data-bs-toggle="modal" data-bs-target="#buyModal" [attr.aria-disabled]="buttonState" (click)="Buy()">Buy</a>
            </div>
         </div>
      </li>
    </ul>
  </div>

  <div class="modal fade" id="buyModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog  modal-dialog-centered">
      <div class="modal-content">

        <div *ngIf="loading">
          <div class="modal-body">
            <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Confirming buy...</span>
              </div>
              <h3>Confirming purchase...</h3>
            </div>
          </div>
        </div>

        <div *ngIf="confirmed">
          <div class="modal-body">
            <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-check-circle text-success" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/>
              </svg>
              <h3>confirmed purchase.</h3>
            </div>
          </div>
           <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>

        <div *ngIf="notConfirmed">
          <div class="modal-body">
            <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-x-circle text-danger" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
              </svg>
              <h3>the purchase cannot be completed.</h3>
            </div>
          </div>
           <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>

      </div>
    </div>
  </div>
</nav>
