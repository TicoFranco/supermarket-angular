<ng-container *ngIf="item; else loading">
  <div class="card mb-3 text-bg-light">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{item.url}}" class="img-fluid" alt="{{item.name}}" style="height: 100%;">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{item.name}}</h5>
        <span>
            Quantidade:
            <button type="button" class="btn btn-danger" (click)="retirar_item()">-</button>
            {{count}}
            <button type="button" class="btn btn-success" (click)="adicionar_item()">+</button>
        </span>
        <p><a href="#" class="link-danger" (click)="deleteItem()">excluir</a></p>
        <p class="card-text">Total:R${{total_item}}</p>
      </div>
    </div>
  </div>
</div>
</ng-container>

<ng-template #loading>
  <div class="card mb-3 text-bg-light" aria-hidden="true">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="..." class="card-img-top" alt="...">
      </div>
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title placeholder-glow">
          <span class="placeholder col-6"></span>
        </h5>
        <p class="card-text placeholder-glow">
          <span class="placeholder col-7"></span>
          <span class="placeholder col-4"></span>
          <span class="placeholder col-4"></span>
          <span class="placeholder col-6"></span>
          <span class="placeholder col-8"></span>
        </p>
        <a class="btn btn-primary disabled placeholder col-6" aria-disabled="true"></a>
      </div>
    </div>
  </div>
</ng-template>
