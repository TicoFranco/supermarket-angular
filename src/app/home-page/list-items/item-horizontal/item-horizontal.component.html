<div class="card mb-3 text-bg-light">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{imagem}}" class="img-fluid" alt="{{nome}}" style="height: 100%;">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{nome}}</h5>
        <span>
            Quantidade:
            <button type="button" class="btn btn-danger" (click)="retirar_item()">-</button>
            {{count}}
            <button type="button" class="btn btn-success" (click)="adicionar_item()">+</button>
        </span>
        <p><a href="#" class="link-danger" (click)="deleteItem()">excluir</a></p>
        <p class="card-text">Total:R${{total_item}}</p>
      </div>
    </div>
  </div>
</div>
