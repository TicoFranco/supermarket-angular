<div class="container d-flex justify-content-center align-items-center" style="flex-direction: column; margin-top: 10rem;">
    <div class="container d-flex justify-content-center align-items-center" style="flex-direction: row;">
        <h1 class="text-primary" style="font-size: 4rem; margin-right: 2rem;">Supermarket</h1>
        <div class="vr text-bg-primary" style="width: 1rem; border-radius: 10px;"></div>
        <h1 class="text-primary" style="font-size: 4rem; margin-left: 2rem;">Login</h1>
    </div>

    <form class="container d-flex border border-primary border-5 rounded-5 mt-2" style="flex-direction: column; width: 50%; text-align: center;" [formGroup]="applyForm" (submit)="login()">

       <div class="form-floating mb-3 mt-3 ms-3 me-3">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" formControlName="email">
          <label for="floatingInput">Email address</label>
        </div>

        <div class="form-floating mb-3 ms-3 me-3">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password" formControlName="password">
          <label for="floatingPassword">Password</label>
        </div>

        <div class="container d-flex" style="flex-direction: row; justify-content: space-between;">
          <div class="form-check ms-2">
              <input class="form-check-input" type="checkbox" value="" id="checkDefault">
              <label class="form-check-label text-secondary" for="checkDefault">Remember me</label>
          </div>
          <a routerLink="" class="link-primary me-2">Forgot password?</a>
        </div>

        <button class="btn btn-primary mt-2 ms-3 me-3" type="submit" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>

        <p class="text-secondary mt-2">Don't have an account?<a routerLink="/cadastro" class="link-primary ms-1">Sign up!</a></p>

    </form>

    <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog  modal-dialog-centered">
            <div class="modal-content">

              <div *ngIf="loading">
                <div class="modal-body">
                  <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
                    <div class="spinner-border text-secondary" role="status">
                      <span class="visually-hidden">Confirming login...</span>
                    </div>
                    <h3 class="text-dark">Confirming login...</h3>
                  </div>
                </div>
              </div>

              <div *ngIf="confirmed">
                <div class="modal-body">
                  <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-check-circle text-success" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                        <path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/>
                    </svg>
                    <h3 class="text-dark">login sucessed.</h3>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><a href="" class="link-light" style="text-decoration: none;">Close</a></button>
                </div>
              </div>

              <div *ngIf="notConfirmed">
                <div class="modal-body">
                  <div class="d-flex justify-content-center align-items-center" style="flex-direction: column;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-x-circle text-danger" viewBox="0 0 16 16">
                      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                      <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                    </svg>
                    <h3 class="text-dark">wrong credentials</h3>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
              </div>
</div>
