<div class="container d-flex justify-content-center align-items-center" style="flex-direction: column; margin-top: 8rem;">

    <h1 class="text-primary">Sign up</h1>
    <p class="text-primary">please fill out the form below</p>

    <div class="container border border-primary border-5 rounded-5" style="width: 40%;">
      
      <div class="container d-flex mt-3 p-0" style="flex-direction: row;">
        
        <div class="form-floating me-3">
          <input type="text" class="form-control" id="floatingFirstName" placeholder="First Name">
          <label for="floatingFirstName">First Name</label>
        </div>

        <div class="form-floating">
          <input type="text" class="form-control" id="floatingLastName" placeholder="Last Name">
          <label for="floatingLastName">Last Name</label>
        </div>

      </div>

      <div class="form-floating mb-3 mt-3">
         <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
         <label for="floatingEmail">Email address</label>
      </div>

      <div class="container d-flex p-0 mb-3" style="flex-direction: row;">
          <div class="form-floating me-3">
            <input type="text" class="form-control" id="floatingCity" placeholder="City">
            <label for="floatingCity">City</label>
          </div>
          <label class="input-group-text" for="SelectState">State</label>
            <select class="form-select" id="SelectState">
              <option class="text-secondary" *ngFor="let state of states">{{state}}</option>
            </select>
      </div>

      <div class="container d-flex p-0 mb-3" style="flex-direction: row;">
        <div class="form-floating me-3">
          <input type="text" class="form-control" id="floatingStreet" placeholder="Street">
          <label for="floatingStreet">Street</label>
        </div>
        <div class="form-floating" style="width: 20%;">
          <input type="text" class="form-control" id="floatingHouseNumber" placeholder="House Number">
          <label for="floatingHouseNumber">Number</label>
        </div>
      </div>

      <div class="form-check">
       <input class="form-check-input" type="checkbox" value="" id="checkDefault">
       <label class="form-check-label text-secondary" for="checkDefault">I agree with the terms 1</label>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
        <label class="form-check-label text-secondary" for="checkDefault">I agree with the terms 2</label>
      </div>

      <div class="container d-flex justify-content-center align-items-center mb-3">
        <input class="btn btn-primary" type="submit" value="Submit">
      </div>

    </div>

</div>
